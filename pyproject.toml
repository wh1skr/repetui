[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repetui"
version = "0.1.2"
description = "A calm terminal interface for reviewing Anki cards"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "wskr" }]
keywords = ["anki", "flashcards", "spaced-repetition", "terminal", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "anki==25.9.2",
    "textual>=7.3,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
repetui = "repetui.cli:main"

[project.urls]
Homepage = "https://github.com/wh1skr/repetui"
Repository = "https://github.com/wh1skr/repetui"
Issues = "https://github.com/wh1skr/repetui/issues"

[tool.hatch.build.targets.wheel]
packages = ["repetui"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
